# Continuous integration: every push to (and pull request into) the three
# long-lived branches typechecks, builds, audits and runs the end-to-end
# suite. Pushes to qa and prod also package the app on all three OSes, since
# those branches are what gets installed (scripts/install.*).
#
# Branch model (docs/ARCHITECTURE.md): dev ──merge──▶ qa ──merge──▶ prod.
#
# Every third-party action is pinned to a full commit SHA (with its tag in a
# comment) so a moved or compromised tag can't change what runs here.
name: CI

on:
  push:
    branches: [dev, qa, prod]
  pull_request:
    branches: [dev, qa, prod]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  verify:
    name: Typecheck, build, audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-fund
      - run: npm run typecheck
      - run: npm run build
      # Fails on any high/critical advisory. Moderates in the build-only
      # electron-builder chain are tracked in security/SECURITY_REVIEW.md.
      - name: Dependency audit
        run: npm audit --audit-level=high

  e2e:
    name: End-to-end tests
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-fund
      # Ubuntu 24.04's AppArmor blocks the unprivileged user namespaces
      # Chromium's sandbox needs; allow them for this throwaway runner rather
      # than launching Electron with --no-sandbox.
      - name: Allow the Chromium sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # Electron needs a display; xvfb provides a virtual one.
      - name: Run Playwright suite
        run: xvfb-run --auto-servernum npm test
        env:
          CI: "true"
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            tst/.artifacts/
          retention-days: 14

  package:
    name: Package (${{ matrix.os }})
    needs: verify
    if: github.event_name == 'push' && (github.ref_name == 'qa' || github.ref_name == 'prod')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: --win
          - os: macos-15
            target: --mac
          - os: ubuntu-24.04
            target: --linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-fund
      - run: npm run build
      # The same unpacked package the install scripts produce — proves the
      # one-line install will succeed on each OS before it reaches prod.
      - run: npx --no-install electron-builder ${{ matrix.target }} --dir --publish never
